<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Movie - Premium Streaming</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #04070d;
            --surface: #0a1120;
            --surface-glass: rgba(10, 17, 32, 0.7);
            --card: #111a2f;
            --accent: #007aff;
            --accent-gradient: linear-gradient(135deg, #007aff, #00c6ff);
            --accent-glow: rgba(0, 122, 255, 0.5);
            --text: #f5f5f7;
            --text-muted: #86868b;
            --glass-border: rgba(255, 255, 255, 0.1);
            --shadow-premium: 0 20px 50px rgba(0, 0, 0, 0.6);
            --trans: all 0.4s cubic-bezier(0.2, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            line-height: 1.5;
        }

        /* PREMIUM SCROLLBAR - HIDDEN BUT SCROLLABLE */
        ::-webkit-scrollbar {
            display: none;
        }
        
        html, body {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* AUTH / LOGIN - CENTERED CINEMATIC THEATER */
        #loginPage {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #020617;
            position: relative;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        /* CINEMATIC STAGE (BACKGROUND) */
        .cinema-stage {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #020617 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            z-index: 1;
        }

        .cinema-stage::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: url('https://www.transparenttextures.com/patterns/black-linen.png');
            opacity: 0.1;
        }

        /* PROJECTOR BEAM (CENTERED) */
        .projector-beam {
            position: absolute;
            top: -200px;
            left: 50%;
            width: 1000px;
            height: 1000px;
            background: conic-gradient(from 150deg at 50% 0%, rgba(59, 130, 246, 0.1) 0deg, transparent 60deg);
            transform: translateX(-50%);
            filter: blur(60px);
            pointer-events: none;
            z-index: 5;
            animation: flicker 4s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 0.6; transform: translateX(-50%) scale(1); }
            50% { opacity: 0.3; transform: translateX(-50%) scale(1.05); }
        }

        /* FLOATING MOVIE TILES */
        .floating-tile {
            position: absolute;
            width: 120px;
            height: 180px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            animation: tile-float 25s infinite linear;
            z-index: 2;
        }

        @keyframes tile-float {
            from { transform: translate(var(--x, 0), 100vh) rotate(0deg); }
            to { transform: translate(var(--x, 0), -300px) rotate(360deg); }
        }

        /* AUTH PANEL (CENTERED) */
        .auth-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(80px) saturate(200%);
            padding: 25px 30px;
            border-radius: 32px;
            width: 380px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 40px 80px rgba(0,0,0,0.8);
            z-index: 10;
            position: relative;
            animation: neural-entrance 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .login-box {
            width: 100%;
            text-align: center;
        }

        @keyframes neural-entrance {
            from { opacity: 0; transform: scale(0.9) translateY(40px); filter: blur(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }

        .auth-toggle {
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px;
            border-radius: 16px;
            margin-bottom: 30px;
            border: 1px solid var(--glass-border);
        }

        .auth-toggle span {
            flex: 1;
            padding: 12px;
            cursor: pointer;
            border-radius: 12px;
            font-size: 14px;
            transition: var(--trans);
            font-weight: 600;
            color: var(--text-muted);
        }

        .auth-toggle span.active {
            background: var(--accent-gradient);
            color: white;
            box-shadow: 0 8px 20px var(--accent-glow);
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .pass-container {
            position: relative;
            display: none;
        }

        .toggle-eye {
            position: absolute;
            right: 15px;
            top: 14px;
            cursor: pointer;
            color: var(--text-muted);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            border: none;
            color: white;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .btn-otp {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            margin-bottom: 15px;
            box-shadow: none;
        }

        /* APP LAYOUT */
        #app {
            display: none;
        }

        .sidebar {
            position: fixed;
            width: 65px; height: calc(100vh - 40px);
            top: 20px; left: 20px;
            background: rgba(4, 7, 13, 0.8);
            backdrop-filter: blur(40px);
            display: flex; flex-direction: column; align-items: center;
            padding: 25px 0; border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            z-index: 1000; transition: var(--trans);
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .sidebar:hover { width: 70px; background: rgba(4, 7, 13, 0.95); }

        .nav-item {
            margin-bottom: 12px; cursor: pointer; opacity: 1; transition: var(--trans);
            font-size: 24px; position: relative; display: flex; justify-content: center;
            align-items: center; width: 45px; height: 45px; border-radius: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        .nav-item:hover { color: #fff; background: rgba(255, 255, 255, 0.1); transform: scale(1.1); }
        .nav-item.active { color: #fff; background: var(--accent-gradient); box-shadow: 0 8px 20px var(--accent-glow); opacity: 1; }

        .nav-icon {
            width: 26px; height: 26px; fill: currentColor; transition: var(--trans);
        }

        .nav-item:hover .nav-icon { filter: drop-shadow(0 0 8px var(--accent)); }

        .nav-item span { display: none; } /* ONLY LOGOS ALLOWED */

        .sidebar-logo {
            margin-bottom: 40px; display: flex; justify-content: center; width: 100%;
        }

        .sidebar-logo img { width: 40px; height: 40px; border-radius: 10px; }

        .sidebar:hover .sidebar-logo span {
            opacity: 1;
        }

        .main-content {
            margin-left: 95px;
            padding-bottom: 100px;
        }

        /* HEADER */
        header {
            position: sticky;
            top: 0;
            padding: 20px 50px;
            background: rgba(11, 15, 26, 0.8);
            backdrop-filter: blur(20px);
            z-index: 90;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-bar {
            width: 400px;
            position: relative;
        }

        .search-bar input {
            margin-bottom: 0;
            padding: 10px 40px;
            border-radius: 20px;
        }

        .search-bar::before {
            content: '🔍';
            position: absolute;
            left: 15px;
            top: 10px;
            opacity: 0.5;
        }

        /* HERO SECTION - HOTSTAR PREMIUM UPGRADE */
        .hero {
            position: relative;
            height: 85vh;
            overflow: hidden;
            margin: 0; 
            background: #000;
        }

        .hero-video {
            position: absolute;
            top: 50%; left: 50%;
            width: 120%; height: 120%; 
            transform: translate(-50%, -50%);
            pointer-events: none;
            opacity: 0.85;
            filter: brightness(0.7) saturate(1.1);
            z-index: 1;
            transition: opacity 1s ease-in-out;
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, #0b0f1a 8%, transparent 50%),
                        linear-gradient(to top, #0b0f1a 0%, transparent 25%);
            z-index: 2;
        }

        .hero-info {
            position: absolute;
            bottom: 120px;
            left: 60px;
            z-index: 5;
            max-width: 500px;
            transition: all 0.5s ease;
        }

        .hero-title {
            font-size: 56px;
            font-weight: 900;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: -1px;
            background: linear-gradient(to right, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-desc {
            font-size: 16px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .hero-dots {
            position: absolute;
            bottom: 40px;
            left: 60px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .dot {
            width: 10px; height: 10px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            cursor: pointer;
            transition: 0.3s;
        }

        .dot.active {
            width: 30px;
            background: var(--accent);
            border-radius: 5px;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .mute-btn {
            position: absolute;
            bottom: 40px;
            right: 60px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            color: white;
            width: 45px; height: 45px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            transition: 0.3s;
        }
        .mute-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.1); }

        .hero-btns {
            display: flex;
            gap: 15px;
        }

        .category-row {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
        }

        .category-row.hero-row {
            height: 75vh;
            overflow: hidden;
            background: #000;
        }

        /* MOVIE ROWS */
        .row {
            padding: 40px 0 0 50px;
        }

        .row-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .row-container {
            display: flex;
            overflow-x: auto;
            gap: 20px;
            padding-bottom: 20px;
            scroll-behavior: smooth;
        }

        .row-container::-webkit-scrollbar {
            display: none;
        }

        /* MOVIE CARD - LUXURY VERSION */
        .movie-card {
            min-width: 220px;
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            transition: var(--trans);
            cursor: pointer;
            background: var(--card);
            border: 1px solid var(--glass-border);
        }

        .movie-card:hover {
            transform: translateY(-10px) scale(1.05);
            z-index: 100;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            border-color: var(--accent);
        }

        .movie-card img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            transition: var(--trans);
        }

        .movie-card:hover img {
            transform: scale(1.1);
            filter: brightness(0.6);
        }

        .movie-info {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 25px 20px;
            background: linear-gradient(to top, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0.8) 50%, transparent 100%);
            opacity: 0;
            transform: translateY(20px);
            transition: var(--trans);
        }

        .movie-card:hover .movie-info {
            opacity: 1;
            transform: translateY(0);
        }

        .movie-name {
            font-weight: 800;
            font-size: 16px;
            margin-bottom: 5px;
            color: #fff;
        }

        .movie-meta {
            font-size: 12px;
            color: var(--accent);
            font-weight: 600;
            display: flex;
            gap: 8px;
        }

        /* LANGUAGE FILTER */
        .nav-tabs {
            display: flex;
            gap: 15px;
            padding: 20px 50px;
            overflow-x: auto;
        }

        .tab-item {
            padding: 8px 20px;
            background: var(--glass);
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid var(--glass-border);
            font-size: 13px;
            white-space: nowrap;
        }

        .tab-item:hover,
        .tab-item.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        /* WATCH PAGE */
        .watch-page {
            display: none;
            padding: 20px 50px;
            background: var(--bg);
            min-height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 200;
            overflow-y: auto;
        }

        .player-wrap {
            width: 100%;
            height: 80vh;
            background: black;
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        }

        .back-btn {
            padding: 12px 25px;
            background: var(--surface);
            border: 1px solid var(--glass-border);
            color: white;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .back-btn:hover {
            background: var(--accent);
        }

        /* AI NEURAL FAB */
        .ai-fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 65px;
            height: 65px;
            background: radial-gradient(circle at 30% 30%, #3b82f6, #1e3a8a);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 2000;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.5);
            animation: ai-pulse 4s infinite ease-in-out;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .chat-box {
            position: fixed; bottom: 110px; right: 30px;
            width: 380px; height: 550px;
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(40px);
            border-radius: 32px; border: 1px solid rgba(255, 255, 255, 0.1);
            display: none; flex-direction: column; z-index: 2000;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
            overflow: hidden; animation: slideUp 0.5s cubic-bezier(0.2, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .chat-header {
            background: linear-gradient(to right, #7c3aed, #1f80e0);
            padding: 15px; display: flex; align-items: center; gap: 10px;
        }

        .chat-messages {
            flex: 1; padding: 15px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 10px;
        }

        .msg { padding: 10px 15px; border-radius: 15px; max-width: 80%; font-size: 14px; }
        .msg.bot { background: rgba(255, 255, 255, 0.05); align-self: flex-start; }
        .msg.user { background: var(--accent); align-self: flex-end; }

        .chat-input { padding: 15px; display: flex; gap: 10px; background: rgba(0, 0, 0, 0.2); }
        .chat-input input { margin-bottom: 0; padding: 10px; border-radius: 10px; }

        .watch-backdrop {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            filter: blur(100px) brightness(0.2); opacity: 0.8; z-index: 0;
            transition: background-image 1.5s ease;
        }

        .watch-container {
            display: flex; gap: 50px; padding: 0 60px 100px 60px;
            max-width: 1800px; margin: 0 auto; position: relative; z-index: 10;
        }

        .player-cinematic {
            width: 100%; aspect-ratio: 16 / 9; background: #000;
            border-radius: 32px; overflow: hidden;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .watch-sidebar {
            width: 400px; background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px); border-radius: 32px;
            padding: 30px; border: 1px solid rgba(255, 255, 255, 0.05);
            height: fit-content; position: sticky; top: 100px;
        }

        #splashScreen {
            position: fixed; inset: 0; background: radial-gradient(circle at center, #0a1120 0%, #04070d 100%);
            z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
    </style>
</head>

<body>
    <!-- AI SPLASH SCREEN -->
    <div id="splashScreen">
        <h1 style="color:white; font-size:40px; font-weight:900; letter-spacing:10px;">FAST MOVIE</h1>
        <div style="margin-top:20px; width:200px; height:2px; background:rgba(255,255,255,0.1); position:relative; overflow:hidden;">
            <div style="position:absolute; top:0; left:0; height:100%; width:50px; background:var(--accent); animation: load 2s infinite;"></div>
        </div>
        <style>@keyframes load { 0% { left:-50px; } 100% { left:200px; } }</style>
    </div>

    <!-- LOGIN PAGE -->
    <div id="loginPage">
        <div class="cinema-stage">
            <div class="projector-beam"></div>
        </div>
        <div class="auth-panel">
            <div class="login-box">
                <h2 style="color:white; margin-bottom:20px;">Fast Movie Login</h2>
                <div class="auth-toggle">
                    <span id="tabLogin" class="active" onclick="setMode('login')">Login</span>
                    <span id="tabRegister" onclick="setMode('register')">Register</span>
                </div>
                <div id="authFields">
                    <div id="nameGroup" style="display:none;"><input id="userName" placeholder="Full Name"></div>
                    <input id="userEmail" type="email" placeholder="Email Address">
                    <input id="userPass" type="password" placeholder="Password">
                    <div id="otpBox" style="display:none;"><input id="otpInput" placeholder="OTP Code"></div>
                    <button id="otpBtn" class="btn-primary btn-otp" style="display:none;" onclick="handleSendOTP()">Send OTP</button>
                    <button id="authBtn" class="btn-primary" onclick="handleAuth()">Sign In</button>
                </div>
                <p id="authError" style="color:red; margin-top:10px; display:none;"></p>
            </div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app">
        <nav class="sidebar">
            <div class="sidebar-logo"><img src="/logo.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/705/705062.png'"></div>
            <div class="nav-item active" onclick="showPage('home')">🏠</div>
            <div class="nav-item" onclick="showPage('search')">🔍</div>
            <div class="nav-item" onclick="showPage('tv')">📺</div>
            <div class="nav-item" onclick="showPage('sports')">⚽</div>
            <div id="adminLink" class="nav-item" style="display:none;" onclick="location.href='/admin'">⚙️</div>
            <div class="nav-item" style="margin-top:auto;" onclick="doLogout()">🚪</div>
        </nav>

        <div class="main-content">
            <header>
                <div style="font-size:24px; font-weight:900;">FAST <span style="color:var(--accent);">MOVIE</span></div>
                <div id="userGreeting">Welcome, User</div>
            </header>

            <div id="homePage" class="page">
                <div class="category-row hero-row" style="height:70vh; background:#000; position:relative;">
                    <iframe id="heroVideo" style="width:100%; height:100%; border:none; opacity:0.6;" src=""></iframe>
                    <div style="position:absolute; bottom:50px; left:50px; z-index:10;">
                        <h1 id="heroTitle" style="font-size:60px; font-weight:900;">Movie Title</h1>
                        <p id="heroDesc" style="max-width:600px; margin:20px 0;">Description goes here...</p>
                        <button class="btn-primary" style="width:200px;" id="heroPlayBtn">▶ WATCH NOW</button>
                    </div>
                </div>
                <div id="movieRows"></div>
            </div>

            <div id="searchPage" class="page" style="display:none; padding:50px;">
                <input id="aiSearchInput" placeholder="Search movies, genres, actors..." style="width:100%; padding:20px; font-size:20px; border-radius:20px;" oninput="handleSearch(this.value)">
                <div id="searchResults" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:20px; margin-top:30px;"></div>
            </div>

            <div id="watchPage" class="page" style="display:none;">
                <div id="watchBackdrop" class="watch-backdrop"></div>
                <div class="watch-container">
                    <div style="flex:1;">
                        <button class="btn-primary" style="width:auto; margin-bottom:20px;" onclick="closeWatch()">❮ Back</button>
                        <div class="player-cinematic"><iframe id="player" width="100%" height="100%" frameborder="0" allowfullscreen></iframe></div>
                        <h1 id="watchTitle" style="font-size:40px; margin-top:30px;"></h1>
                        <p id="watchDesc" style="margin-top:20px; opacity:0.8; line-height:1.6;"></p>
                    </div>
                    <div class="watch-sidebar"><h3>Up Next</h3><div id="relatedContainer"></div></div>
                </div>
            </div>
        </div>
    </div>

    <div class="ai-fab" onclick="toggleChat()">🧠</div>
    <div id="chatBox" class="chat-box">
        <div class="chat-header"><span>🤖 AI Assistant</span><button onclick="toggleChat()" style="background:none; border:none; color:white; cursor:pointer;">×</button></div>
        <div id="chatMessages" class="chat-messages"></div>
        <div class="chat-input"><input id="chatInput" placeholder="Ask anything..."><button onclick="sendMessage()">➔</button></div>
    </div>

    <script>
        let movies = [];
        let history = [];
        let authMode = 'login';

        async function init() {
            try {
                const res = await fetch('/api/movies');
                movies = await res.json();
                renderAllRows(movies);
                updateHero(movies[0]);
            } catch(e) { console.error("Init failed", e); }
            
            const user = localStorage.getItem('currentUser');
            if(user) {
                const data = JSON.parse(user);
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                if(data.isAdmin) document.getElementById('adminLink').style.display = 'block';
            }
            setTimeout(() => document.getElementById('splashScreen').style.display = 'none', 1500);
        }

        function renderAllRows(data) {
            const container = document.getElementById('movieRows');
            container.innerHTML = `<div class="row"><div class="row-title">Popular Content</div><div class="row-container">${data.map(m => `
                <div class="movie-card" onclick="openWatch(${m.id})">
                    <img src="${m.img}">
                    <div class="movie-info"><div class="movie-name">${m.title}</div></div>
                </div>
            `).join('')}</div></div>`;
        }

        function updateHero(m) {
            if(!m) return;
            document.getElementById('heroTitle').innerText = m.title;
            document.getElementById('heroDesc').innerText = m.description;
            document.getElementById('heroVideo').src = `https://www.youtube.com/embed/${m.video}?autoplay=1&mute=1&controls=0&loop=1&playlist=${m.video}`;
            document.getElementById('heroPlayBtn').onclick = () => openWatch(m.id);
        }

        function openWatch(id) {
            const m = movies.find(x => x.id == id);
            if(!m) return;
            document.getElementById('watchTitle').innerText = m.title;
            document.getElementById('watchDesc').innerText = m.description;
            document.getElementById('player').src = `https://www.youtube.com/embed/${m.video}?autoplay=1`;
            document.getElementById('watchBackdrop').style.backgroundImage = `url(${m.img})`;
            showPage('watch');
        }

        function closeWatch() { document.getElementById('player').src = ''; showPage('home'); }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            document.getElementById(id + 'Page').style.display = 'block';
        }

        function setMode(m) {
            authMode = m;
            document.getElementById('nameGroup').style.display = m === 'register' ? 'block' : 'none';
            document.getElementById('otpBtn').style.display = m === 'register' ? 'block' : 'none';
            document.getElementById('authBtn').innerText = m === 'login' ? 'Sign In' : 'Create Account';
        }

        async function handleAuth() {
            const email = document.getElementById('userEmail').value;
            const password = document.getElementById('userPass').value;
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email, password})
            });
            const data = await res.json();
            if(res.ok) {
                localStorage.setItem('currentUser', JSON.stringify(data));
                location.reload();
            } else {
                document.getElementById('authError').innerText = data.error;
                document.getElementById('authError').style.display = 'block';
            }
        }

        function doLogout() { localStorage.removeItem('currentUser'); location.reload(); }

        function toggleChat() { 
            const b = document.getElementById('chatBox');
            b.style.display = b.style.display === 'flex' ? 'none' : 'flex';
        }

        init();
    </script>
</body>
</html>
